<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- save theme -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        if (saved) {
          document.documentElement.setAttribute("data-theme", saved);
        } else {
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          document.documentElement.setAttribute(
            "data-theme",
            prefersDark ? "retro" : "cupcake",
          );
        }
      })();
    </script>

    <!-- preload image video -->
    <link rel="preload" as="video" href="/videos/hero.mp4" />

    <!-- favicon -->
    <link rel="icon" type="image/png" href="/images/chef2.png" />

    <!-- body fonts -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=ranade@300&f[]=excon@500&display=swap"
      rel="stylesheet"
    />
    <!-- logo font -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=gambarino@400&display=swap"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let's Cook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
